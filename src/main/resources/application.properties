spring.application.name=vitryne.backend
spring.datasource.url=jdbc:postgresql://localhost:${KEY_DB_PORT}/${KEY_DB}
spring.datasource.username=${KEY_DB_USER}
spring.datasource.password=${KEY_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.config.import=optional:file:.env[.properties]
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key
# Prazo para a loja aceitar o pedido (ETI-412); vencido, o pedido é cancelado automaticamente.
vitryne.orders.acceptance-timeout=${ORDER_ACCEPTANCE_TIMEOUT:30m}
vitryne.orders.acceptance-expiration.interval=${ORDER_ACCEPTANCE_EXPIRATION_INTERVAL:PT1M}
# Upload de imagens (ETI-431): até 8 arquivos de 5 MB por envio.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=41MB
# Credencial do Cloudinary (cloudinary://<api_key>:<api_secret>@<cloud_name>); sem ela o upload responde 503.
vitryne.images.cloudinary-url=${CLOUDINARY_URL:}
vitryne.images.folder=${CLOUDINARY_FOLDER:vitryne}
# Imagem enviada e não usada em produto (ou removida dele) é apagada depois deste prazo.
vitryne.images.orphan-retention=${IMAGE_ORPHAN_RETENTION:24h}
vitryne.images.orphan-cleanup.interval=${IMAGE_ORPHAN_CLEANUP_INTERVAL:PT1H}
# Fuso dos horários de funcionamento das lojas (ETI-433); usado no isOpen da vitrine.
vitryne.stores.timezone=${STORE_TIMEZONE:America/Sao_Paulo}
