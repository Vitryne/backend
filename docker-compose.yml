version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: vitryne-postgres
    restart: always
    environment:
      POSTGRES_USER: ${KEY_DB_USER}
      POSTGRES_PASSWORD: ${KEY_DB_PASSWORD}
      POSTGRES_DB: ${KEY_DB}
    ports:
      - "${KEY_DB_PORT}:5432"
    volumes:
      - vitryne_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: vitryne-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${KEY_DB}

volumes:
  vitryne_postgres_data: